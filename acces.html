<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Accès administrateur · Duqque Sports</title>
<meta name="robots" content="noindex, nofollow" />
<style>
/* =========================================================
   ACCÈS ADMINISTRATEUR
   Page autonome, dans la charte du site. Le mot de passe n'est pas ici : son
   empreinte vit dans acces-cle.js, exclu du depot.
   ========================================================= */
@font-face { font-family: 'LT Museum'; src: url('assets/fonts/LTMuseum-Black.woff2') format('woff2'); font-weight: 900; font-style: normal; font-display: swap; }
@font-face { font-family: 'Gilroy'; src: url('assets/fonts/Gilroy-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Gilroy'; src: url('assets/fonts/Gilroy-SemiBold.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }

:root {
  --noir: #0a0a0a; --noir-doux: #121212; --creme: #f5f3ef;
  --violet: #4a1fc7; --violet-clair: #c4b3ff; --lime: #d9ff3d;
  --ligne: rgba(255,255,255,0.12);
  --display: 'LT Museum', Georgia, serif;
  --sans: 'Gilroy', -apple-system, BlinkMacSystemFont, sans-serif;
  --ease: cubic-bezier(.22,.61,.36,1);
}
*, *::before, *::after { box-sizing: border-box; }
/* Page fixe : pas de defilement. 100dvh et non 100vh, sinon la barre d'adresse
   mobile rogne la hauteur et la carte se retrouve coupee clavier ouvert. */
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0; height: 100dvh; background: var(--noir); color: var(--creme);
  font-family: var(--sans); font-size: 16px; line-height: 1.6;
  display: grid; place-items: center; padding: 20px;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
/* Si la hauteur manque vraiment, la carte se resserre plutot que d'etre tronquee. */
@media (max-height: 620px) {
  .boite { padding: 22px 26px; }
  h1 { font-size: 22px; }
  .intro { font-size: 13.5px; margin-bottom: 20px; }
  .marque { margin-bottom: 18px; }
  button { margin-top: 20px; padding: 14px 24px; }
  .retour { margin-top: 18px; }
}
/* Tres petits ecrans : la carte debordait de 20px et le lien de retour se retrouvait
   coupe. La phrase d'introduction disparait, elle n'est pas necessaire pour agir. */
@media (max-height: 560px) {
  body { padding: 12px; }
  .boite { padding: 18px 22px; }
  .marque { font-size: 21px; margin-bottom: 14px; }
  h1 { font-size: 19px; margin-bottom: 0; }
  .intro { display: none; }
  form { margin-top: 18px; }
  button { margin-top: 16px; padding: 13px 22px; }
  .message { margin-top: 12px; }
  .retour { margin-top: 14px; }
}
.halo {
  position: fixed; top: -20%; right: -15%; width: min(70vw, 700px); aspect-ratio: 1;
  background: radial-gradient(circle, rgba(119,71,255,0.28) 0%, transparent 62%);
  filter: blur(30px); pointer-events: none;
}
.boite {
  position: relative; width: min(100%, 440px);
  background: var(--noir-doux); border: 1px solid var(--ligne);
  border-radius: 20px; padding: clamp(28px, 5vw, 44px);
}
.marque { font-family: var(--sans); font-weight: 600; font-size: 24px; letter-spacing: -0.02em; margin: 0 0 26px; }
h1 {
  font-family: var(--display); font-weight: 900; text-transform: uppercase;
  font-size: 27px; line-height: 1.06; letter-spacing: -0.025em; margin: 0 0 12px;
}
.intro { font-size: 14.5px; line-height: 1.6; color: rgba(245,243,239,0.86); margin: 0 0 28px; }
label {
  display: block; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  font-weight: 700; color: var(--violet-clair); margin-bottom: 9px;
}
input {
  width: 100%; background: transparent; border: none;
  border-bottom: 1.5px solid var(--ligne); color: var(--creme);
  padding: 12px 0; font-family: var(--sans); font-size: 17px;
  transition: border-color .3s var(--ease);
}
input:focus { outline: none; border-color: var(--lime); }
button {
  width: 100%; margin-top: 26px; cursor: pointer; border: none;
  background: var(--violet); color: #fff; border-radius: 100px; padding: 16px 26px;
  font-family: var(--sans); font-size: 13.5px; font-weight: 600; letter-spacing: 0.04em;
  transition: background .3s var(--ease), color .3s var(--ease), transform .3s var(--ease);
}
button:hover { background: var(--lime); color: #0b0b0b; transform: translateY(-2px); }
button:focus-visible { outline: 3px solid var(--violet-clair); outline-offset: 3px; }
.piege { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.message { margin: 18px 0 0; font-size: 13.5px; line-height: 1.5; min-height: 20px; }
.message.ko { color: #ffb3b3; }
.message.ok { color: var(--lime); }
.retour { display: block; margin-top: 26px; font-size: 12.5px; color: rgba(245,243,239,0.72); text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.25); width: max-content; }
.retour:hover { color: var(--creme); border-color: var(--creme); }
</style>
</head>
<body>
<div class="halo" aria-hidden="true"></div>

<main class="boite">
 <p class="marque">duqque</p>
 <h1>Accès administrateur</h1>
 <p class="intro">Le site est en préparation. Cette page ouvre la version complète pour trente jours, sur cet appareil.</p>

 <form id="f" autocomplete="off">
  <label for="mp">Mot de passe</label>
  <input id="mp" type="password" name="mp" autocomplete="current-password" required autofocus />
  <!-- Champ piege : invisible et hors du parcours clavier. Un humain ne le voit jamais,
       un robot qui remplit tous les champs se trahit en le renseignant. -->
  <div class="piege" aria-hidden="true">
   <label for="societe">Société</label>
   <input id="societe" name="societe" type="text" tabindex="-1" autocomplete="off" />
  </div>
  <button type="submit">Ouvrir le site</button>
 </form>

 <p class="message" id="msg" role="status" aria-live="polite"></p>
 <a class="retour" href="/">Retour à la page d'accueil</a>
</main>

<!-- La cle vit hors du depot. Si ce fichier manque, la page le dit plutot que d'echouer en silence. -->
<script src="acces-cle.js"></script>
<script>
(function () {
 var f = document.getElementById('f'), msg = document.getElementById('msg');

 if (!window.DUQQUE_ACCES || !window.DUQQUE_ACCES.cle) {
  msg.className = 'message ko';
  msg.textContent = "Le fichier acces-cle.js est absent du serveur. Déposez-le à la racine, à côté de cette page.";
  f.querySelector('button').disabled = true;
  return;
 }

 // Derivation PBKDF2 : chaque essai coute environ deux dixiemes de seconde de calcul.
 // Instantane pour qui connait le mot de passe, dissuasif pour un parcours exhaustif.
 var hex = function (buf) {
  return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
 };
 var octets = function (h) {
  return new Uint8Array(h.match(/../g).map(function (b) { return parseInt(b, 16); }));
 };

 async function derive(mdp) {
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(mdp), 'PBKDF2', false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits({
   name: 'PBKDF2',
   salt: octets(window.DUQQUE_ACCES.sel),
   iterations: window.DUQQUE_ACCES.iterations,
   hash: 'SHA-256'
  }, base, 256);
  return hex(bits);
 }

 // Blocage progressif : au-dela de cinq echecs, l'attente double a chaque fois.
 var CLE_ECHECS = 'duqque_echecs';
 function etat() {
  try { return JSON.parse(localStorage.getItem(CLE_ECHECS)) || { n: 0, jusqua: 0 }; }
  catch (e) { return { n: 0, jusqua: 0 }; }
 }
 function noter(v) { try { localStorage.setItem(CLE_ECHECS, JSON.stringify(v)); } catch (err) {} }

 var charge = Date.now();

 f.addEventListener('submit', async function (e) {
  e.preventDefault();
  var st = etat();
  var reste = Math.ceil((st.jusqua - Date.now()) / 1000);
  if (reste > 0) {
   msg.className = 'message ko';
   msg.textContent = 'Trop de tentatives. Réessayez dans ' + reste + ' seconde' + (reste > 1 ? 's' : '') + '.';
   return;
  }

  // Deux signaux de robot : le champ piege rempli, ou un envoi quasi instantane.
  if (document.getElementById('societe').value !== '' || Date.now() - charge < 1200) {
   msg.className = 'message ko';
   msg.textContent = 'Vérification impossible. Rechargez la page et réessayez.';
   return;
  }

  msg.className = 'message';
  msg.textContent = 'Vérification…';
  f.querySelector('button').disabled = true;
  try {
   var k = await derive(document.getElementById('mp').value);
   if (k !== window.DUQQUE_ACCES.cle) {
    var n = st.n + 1;
    var attente = n >= 5 ? Math.min(30 * Math.pow(2, n - 5), 900) : 0;
    noter({ n: n, jusqua: attente ? Date.now() + attente * 1000 : 0 });
    msg.className = 'message ko';
    msg.textContent = attente
     ? 'Mot de passe incorrect. Nouvelle tentative dans ' + attente + ' secondes.'
     : 'Mot de passe incorrect.';
    return;
   }
   noter({ n: 0, jusqua: 0 });
   // 30 jours, tout le site. SameSite=Lax pour que le cookie suive la navigation.
   document.cookie = 'duqque_apercu=' + window.DUQQUE_ACCES.jeton +
    '; Max-Age=2592000; Path=/; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '');

   /* Ouverture de la session serveur, qui commande l'acces aux reponses des
      questionnaires. La verification faite ci-dessus vit dans le navigateur :
      elle suffit a masquer un site en preparation, pas a garder des donnees.
      Si le PHP est absent, l'apercu du site fonctionne quand meme et la page
      resultats le dira clairement plutot que d'echouer sans explication. */
   var soucis = '';
   try {
    var rep = await fetch('/api/session.php', {
     method: 'POST', credentials: 'same-origin',
     headers: { 'Content-Type': 'application/json' },
     body: JSON.stringify({ mdp: document.getElementById('mp').value })
    });
    var j = await rep.json();
    if (j && j.ok) document.cookie = 'duqque_admin_ui=1; Max-Age=2592000; Path=/; SameSite=Lax';
    else soucis = (j && j.erreur) ? j.erreur : 'réponse inattendue du serveur';
   } catch (e) { soucis = 'serveur injoignable'; }

   /* L'apercu du site s'ouvre quand meme, mais taire l'echec de la session
      serveur laisserait chercher pourquoi l'espace administrateur n'apparait
      nulle part. On le dit, et on laisse le temps de le lire. */
   if (soucis) {
    msg.className = 'message ko';
    msg.innerHTML = "Site ouvert, mais l'espace administrateur reste fermé&nbsp;: " + soucis +
     '.<br/><a href="/api/etat.php" style="color:#d9ff3d">Vérifier l\'état du dispositif</a>';
    setTimeout(function () { location.href = '/home.html'; }, 6000);
    return;
   }

   msg.className = 'message ok';
   msg.textContent = 'Accès ouvert. Redirection…';
   setTimeout(function () { location.href = '/home.html'; }, 500);
  } catch (err) {
   msg.className = 'message ko';
   msg.textContent = "Vérification impossible sur cette connexion. Ouvrez la page en https.";
  } finally {
   f.querySelector('button').disabled = false;
  }
 });
})();
</script>
</body>
</html>
